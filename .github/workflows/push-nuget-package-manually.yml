name: Push nuget package manually
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version of the package, no "v" prefix'
        required: true
        default: '1.0.0'

jobs:
  push-nuget-manually:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - name: git pull
      uses: actions/checkout@v3

    - name: setting dotnet
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: |
          9.0.x
          8.0.x
          7.0.x
          6.0.x
        include-prerelease: true

    - name: build
      run: dotnet build Masa.Blazor.Build.slnx -c Release /p:ContinuousIntegrationBuild=true

    - name: pack
      run: dotnet pack Masa.Blazor.Build.slnx --no-build --include-symbols -c Release -p:Version=${{github.event.inputs.version}}

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{secrets.NUGET_USER}}

    - name: package push
      run: dotnet nuget push "**/*.symbols.nupkg" --skip-duplicate -k ${{steps.login.outputs.NUGET_API_KEY}}  -s https://api.nuget.org/v3/index.json